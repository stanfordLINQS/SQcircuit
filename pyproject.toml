[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SQcircuit"
requires-python = ">=3.9"
dynamic = ["dependencies", "version"]
authors = [
    {name = "Taha Rajabzadeh", email = "tahar@stanford.edu"},
    {name = "Alex Boulton-McKeehan", email = "mckeehan@stanford.edu"},
    {name = "Sam Bonkowsky", email = "sbonkov@ucsb.edu"},
    {name = "Amir Safavi-Naeini", email = "safavi@stanford.edu"}
]
description = "superconducting quantum circuit analyzer"
readme = "pypi-readme.md"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent"
]
keywords = [
    "superconducting", "circuits",
    "superconducting circuits"
]

[project.optional-dependencies]
gpu = ["cupy"]
tests = ["pytest"]

[project.urls]
Homepage = "https://sqcircuit.org"
Repository = "https://github.com/stanfordLINQS/SQcircuit"

[tool.setuptools]
packages = ["SQcircuit"]

[tool.setuptools_scm]
version_file = "SQcircuit/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.1.0"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
